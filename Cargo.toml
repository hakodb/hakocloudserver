[package]
name = "hakocloudserver"
version = "0.1.1"
edition = "2021"
description = "Standalone HakoDB cloud-sync server with admin console"
license = "MIT"

[[bin]]
name = "hakocloudserver"
path = "src/main.rs"

[dependencies]
# Core from crates.io (publishable; sync via the cloud-sync feature).
hakodb = { version = "0.8.23", default-features = false, features = ["cloud-sync"] }
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
argon2 = "0.5"
rand = "0.8"
futures-core = "0.3"
rust-embed = "8"
axum-server = { version = "0.7", features = ["tls-rustls"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.6"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
