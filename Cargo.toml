[package]
name = "firelite-cloudserver"
version = "0.1.1"
edition = "2021"
description = "Standalone FireLite cloud-sync server with admin console"

[[bin]]
name = "firelite-cloudserver"
path = "src/main.rs"

[dependencies]
# Pinned to the core branch until the first crates.io release,
# then switch to `version = "0.8"`.
hakodb = { git = "https://github.com/rizaptk/firelite.git", branch = "cloud_sync", features = ["cloud-sync"] }
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
argon2 = "0.5"
rand = "0.8"
futures-core = "0.3"
rust-embed = "8"
axum-server = { version = "0.7", features = ["tls-rustls"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.6"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
